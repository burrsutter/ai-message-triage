apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: message-triage-http-intake
  namespace: message-triage
  labels:
    app.kubernetes.io/name: message-triage-http-intake
    app.kubernetes.io/part-of: ai-message-triage
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: message-triage-http-intake
  namespace: message-triage
  labels:
    app.kubernetes.io/name: message-triage-http-intake
    app.kubernetes.io/part-of: ai-message-triage
spec:
  runPolicy: Serial
  source:
    type: Dockerfile
    dockerfile: |-
      FROM python:3.12-slim
      ENV PYTHONDONTWRITEBYTECODE=1 PYTHONUNBUFFERED=1 PORT=8080
      WORKDIR /opt/app
      COPY intake/requirements.txt ./intake/requirements.txt
      RUN pip install --no-cache-dir -r intake/requirements.txt
      COPY models ./models
      COPY intake ./intake
      RUN chgrp -R 0 /opt/app && chmod -R g=u /opt/app
      EXPOSE 8080
      USER 1001
      CMD ["uvicorn", "intake.http_intake:app", "--host", "0.0.0.0", "--port", "8080"]
    configMaps:
      - configMap:
          name: message-triage-http-intake-build-intake
        destinationDir: intake
      - configMap:
          name: message-triage-http-intake-build-models
        destinationDir: models
  strategy:
    type: Docker
    dockerStrategy: {}
  output:
    to:
      kind: ImageStreamTag
      name: message-triage-http-intake:latest
  successfulBuildsHistoryLimit: 2
  failedBuildsHistoryLimit: 2
