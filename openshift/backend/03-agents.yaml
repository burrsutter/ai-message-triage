apiVersion: apps/v1
kind: Deployment
metadata:
  name: message-triage-structure
  namespace: message-triage
  labels: &structure-labels
    app.kubernetes.io/name: message-triage-structure
    app.kubernetes.io/component: agent
    app.kubernetes.io/part-of: ai-message-triage
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: message-triage-structure
  template:
    metadata:
      labels: *structure-labels
    spec:
      containers:
        - name: agent
          image: image-registry.openshift-image-registry.svc:5000/message-triage/message-triage-backend:latest
          imagePullPolicy: Always
          command: ["python", "-m", "structure.message-structure"]
          envFrom:
            - configMapRef: {name: message-triage-agent-common}
            - configMapRef: {name: message-triage-structure}
            - secretRef: {name: message-triage-model-credentials}
          resources:
            requests: {cpu: 25m, memory: 96Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
            runAsNonRoot: true
            seccompProfile: {type: RuntimeDefault}
---
