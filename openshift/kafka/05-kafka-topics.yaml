# The 12 topics the ai-message-triage pipeline uses, declared as KafkaTopic CRs
# and reconciled by the Topic Operator. These mirror reset.sh / .env.example:
# all partitions=1, replicas=1 (single-broker dev cluster).
#
# Pipeline flow:
#   intake -> structured -> cleared -> ready -> {support|finance|website} -> outflow
#   ready/review -> sales   (opportunity finder)
#   input/output are legacy/test topics; review holds messages that need attention.
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: kafka-input
  namespace: message-triage
  labels:
    strimzi.io/cluster: message-triage-kafka
spec:
  topicName: input
  partitions: 1
  replicas: 1
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: kafka-output
  namespace: message-triage
  labels:
    strimzi.io/cluster: message-triage-kafka
spec:
  topicName: output
  partitions: 1
  replicas: 1
---
