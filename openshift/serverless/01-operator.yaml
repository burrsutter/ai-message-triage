# Red Hat OpenShift Serverless operator (Knative Serving + Eventing).
# The operator only supports the AllNamespaces install mode, so it goes in its own
# openshift-serverless namespace with a cluster-scoped OperatorGroup (empty spec).
apiVersion: v1
kind: Namespace
metadata:
  name: openshift-serverless
---
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: serverless-operators
  namespace: openshift-serverless
spec: {}   # empty = watch all namespaces (AllNamespaces)
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: serverless-operator
  namespace: openshift-serverless
spec:
  channel: stable
  name: serverless-operator
  source: redhat-operators
  sourceNamespace: openshift-marketplace
  installPlanApproval: Automatic
